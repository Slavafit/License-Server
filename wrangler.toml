name = "license-server"
main = "src/secure.ts"
# Newest date supported by the currently installed Wrangler/workerd runtime.
compatibility_date = "2026-07-13"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true

[[d1_databases]]
binding = "DB"
database_name = "license-db"
database_id = "3018f38d-d669-4781-a5a2-e49879be82e9"
